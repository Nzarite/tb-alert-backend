spring.application.name=tb-alert-backend
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tbAlert
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

#Scheduler
app.notification.timezone=Asia/Kolkata

#Plivo SMS Platform
plivo.auth.id=your_auth_id
plivo.auth.token=your_auth_token
app.notification.sender-id=your-sender-id

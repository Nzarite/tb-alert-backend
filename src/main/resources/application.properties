spring.application.name=tb-alert-backend

# Database Configuration
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/tbAlert
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.datasource.username=root
spring.datasource.password=password
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG

# Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none

# Liquibase Settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.xml
logging.level.liquibase=DEBUG

#Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/tb-alert

jwt.auth.converter.resource-id=tb-alert-frontend
jwt.auth.converter.principal-attribute=preferred_username

keycloak.realm=tb-alert
keycloak.url=http://localhost:8081
keycloak.client-id=tb-alert-frontend
keycloak.username=admin@admin.admin
keycloak.password=admin
keycloak.client-id-id=a4933a77-6d47-4376-aa88-b230c57d7d95

logging.level.org.springframework.security=DEBUG

#Scheduler
app.notification.timezone=Asia/Kolkata
app.scheduler.threadpool-size=10

#Plivo SMS Platform
plivo.auth.id=your_auth_id
plivo.auth.token=your_auth_token
app.notification.sender-id=your-sender-id
app.config.plivo-connection=false
